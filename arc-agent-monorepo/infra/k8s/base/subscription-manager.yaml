---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-manager
  namespace: arc-agents
  labels:
    app: subscription-manager
    app.kubernetes.io/part-of: arc-agent-monorepo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subscription-manager
  template:
    metadata:
      labels:
        app: subscription-manager
    spec:
      containers:
        - name: subscription-manager
          image: arc-agents/subscription-manager:latest
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: arc-agent-secrets
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-manager-service
  namespace: arc-agents
spec:
  selector:
    app: subscription-manager
  ports:
    - port: 3002
      targetPort: 3002
