---
# IMPORTANT: Do not commit real values. Populate via CI/CD:
#   kubectl create secret generic arc-agent-secrets \
#     --from-literal=CIRCLE_API_KEY=$CIRCLE_API_KEY \
#     --from-literal=CIRCLE_ENTITY_SECRET=$CIRCLE_ENTITY_SECRET \
#     --namespace arc-agents
apiVersion: v1
kind: Secret
metadata:
  name: arc-agent-secrets
  namespace: arc-agents
type: Opaque
stringData:
  CIRCLE_API_KEY: "REPLACE_IN_CI"
  CIRCLE_ENTITY_SECRET: "REPLACE_IN_CI"
  CIRCLE_WALLET_SET_ID: "REPLACE_IN_CI"
  DATABASE_URL: "REPLACE_IN_CI"
  REDIS_URL: "redis://redis-service:6379"
  OPENAI_API_KEY: "REPLACE_IN_CI"
  ANTHROPIC_API_KEY: "REPLACE_IN_CI"
  ARC_RPC_URL: "https://rpc.testnet.arc.network/"
  BASE_RPC_URL: "https://mainnet.base.org"
  ETH_RPC_URL: "https://eth.llamarpc.com"
