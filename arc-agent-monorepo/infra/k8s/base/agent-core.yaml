---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-core
  namespace: arc-agents
  labels:
    app: agent-core
    app.kubernetes.io/part-of: arc-agent-monorepo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-core
  template:
    metadata:
      labels:
        app: agent-core
    spec:
      containers:
        - name: agent-core
          image: arc-agents/agent-core:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: arc-agent-secrets
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agent-core-service
  namespace: arc-agents
spec:
  selector:
    app: agent-core
  ports:
    - port: 3001
      targetPort: 3001
