---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-engine
  namespace: arc-agents
  labels:
    app: loyalty-engine
    app.kubernetes.io/part-of: arc-agent-monorepo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loyalty-engine
  template:
    metadata:
      labels:
        app: loyalty-engine
    spec:
      containers:
        - name: loyalty-engine
          image: arc-agents/loyalty-engine:latest
          ports:
            - containerPort: 3006
          envFrom:
            - secretRef:
                name: arc-agent-secrets
          env:
            - name: PORT
              value: "3006"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-engine-service
  namespace: arc-agents
spec:
  selector:
    app: loyalty-engine
  ports:
    - port: 3006
      targetPort: 3006
