---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-settlement
  namespace: arc-agents
  labels:
    app: merchant-settlement
    app.kubernetes.io/part-of: arc-agent-monorepo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merchant-settlement
  template:
    metadata:
      labels:
        app: merchant-settlement
    spec:
      containers:
        - name: merchant-settlement
          image: arc-agents/merchant-settlement:latest
          ports:
            - containerPort: 3003
          envFrom:
            - secretRef:
                name: arc-agent-secrets
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-settlement-service
  namespace: arc-agents
spec:
  selector:
    app: merchant-settlement
  ports:
    - port: 3003
      targetPort: 3003
