---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-pay
  namespace: arc-agents
  labels:
    app: streaming-pay
    app.kubernetes.io/part-of: arc-agent-monorepo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-pay
  template:
    metadata:
      labels:
        app: streaming-pay
    spec:
      containers:
        - name: streaming-pay
          image: arc-agents/streaming-pay:latest
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: arc-agent-secrets
          env:
            - name: PORT
              value: "3005"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-pay-service
  namespace: arc-agents
spec:
  selector:
    app: streaming-pay
  ports:
    - port: 3005
      targetPort: 3005
