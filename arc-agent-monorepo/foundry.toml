[profile.default]
src = "packages/arc-contracts/src/solidity"
out = "packages/arc-contracts/artifacts"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"

[profile.default.rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network/"
base = "${BASE_RPC_URL}"
mainnet = "${ETH_RPC_URL}"

[profile.default.etherscan]
arc_testnet = { key = "verifytoken", url = "https://testnet.arcscan.app/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
