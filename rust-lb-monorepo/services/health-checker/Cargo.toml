[package]
name = "health-checker"
version = "1.0.0"
edition = "2021"
description = "Standalone health checker daemon — polls backends and publishes status"

[[bin]]
name = "health-checker"
path = "src/main.rs"

[dependencies]
lb-core = { path = "../../packages/lb-core" }
metrics-core = { path = "../../packages/metrics" }
lb-tracing = { path = "../../packages/tracing" }

