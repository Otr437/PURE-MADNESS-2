[workspace]
members = [
    "services/load-balancer",
    "services/shard-manager",
    "services/health-checker",
    "packages/lb-core",
    "packages/metrics",
    "packages/tracing",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.38.0", features = ["full"] }
axum = { version = "0.7.5", features = ["tracing"] }
hyper = { version = "1.4.1", features = ["full"] }
hyper-util = { version = "0.1.6", features = ["full"] }
tower = { version = "0.4.13", features = ["full"] }
tower-http = { version = "0.5.2", features = ["trace", "cors", "compression-gzip", "request-id", "timeout"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.119"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
uuid = { version = "1.9.1", features = ["v4", "serde"] }
anyhow = "1.0.86"
thiserror = "1.0.61"
async-trait = "0.1.81"
dashmap = "6.0.1"
arc-swap = "1.7.1"
prometheus = { version = "0.13.4", features = ["process"] }
metrics = "0.23.0"
metrics-exporter-prometheus = "0.15.0"
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
tokio-rustls = "0.26.0"
rustls = "0.23.11"
rustls-pemfile = "2.1.2"
reqwest = { version = "0.12.5", features = ["json", "rustls-tls"], default-features = false }
config = "0.14.0"
dotenvy = "0.15.7"
chrono = { version = "0.4.38", features = ["serde"] }
bytes = "1.6.0"
futures = "0.3.30"
parking_lot = "0.12.3"
clap = { version = "4.5.9", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
