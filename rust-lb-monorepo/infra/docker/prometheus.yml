global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "load-balancer"
    static_configs:
      - targets: ["load-balancer:9090"]
    metrics_path: /metrics

  - job_name: "shard-manager"
    static_configs:
      - targets: ["shard-manager:7070"]
    metrics_path: /metrics

  - job_name: "health-checker"
    static_configs:
      - targets: ["health-checker:6060"]
    metrics_path: /metrics
