[package]
name = "waf-microservice"
version = "1.0.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# Redis for rate limiting
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Regex and pattern matching
regex = "1.11"
fancy-regex = "0.14"

# Security
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
argon2 = "0.5"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# IP handling
ipnetwork = "0.20"

# Configuration
config = "0.14"
dotenv = "0.15"

# HTTP client for backend proxying
reqwest = { version = "0.12", features = ["json"] }

# GeoIP
maxminddb = "0.24"

# Rate limiting
governor = "0.7"

# OWASP Core Rule Set patterns
lazy_static = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Config parsing
toml = "0.8"
num_cpus = "1.16"

[dev-dependencies]
criterion = "0.5"
