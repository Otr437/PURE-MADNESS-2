# WAF Microservice Configuration

# Server Settings
port = 8080
workers = 4

# Database
database_url = "sqlite://waf_data.db"

# Rate Limiting
rate_limit_requests = 100
rate_limit_window = 60  # seconds
rate_limit_ban_duration = 300  # 5 minutes

# Brute Force Protection
login_max_attempts = 5
login_attempt_window = 300  # 5 minutes
login_ban_duration = 900  # 15 minutes

# Request Size Limits
max_request_size = 10485760  # 10MB in bytes
max_header_size = 8192  # 8KB
max_url_length = 2048

# Attack Response
attack_ban_duration = 3600  # 1 hour

# Features
enable_geoip = false
enable_bot_detection = true
enable_rate_limiting = true

# Backend Services (for proxying)
[[backends]]
name = "api"
url = "http://localhost:3000"
path_prefix = "/api"

[[backends]]
name = "web"
url = "http://localhost:8000"
path_prefix = "/"
