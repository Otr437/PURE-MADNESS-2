# ============================================================
# DOCKER COMPOSE — AI Blockchain Ops
# Full production stack:
#   - PostgreSQL 16
#   - AI Blockchain Ops (all 14 modules in one container)
#   - Nginx reverse proxy with SSL termination
#   - Anvil local blockchain (optional, for testing)
# ============================================================

version: '3.9'

services:

  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aiblockchain}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # Bind to localhost only — not exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiblockchain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aiops-internal
    security_opt:
      - no-new-privileges:true

  # ── AI Blockchain Ops (all 14 modules) ──────────────────────
  aiops:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aiops-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Required
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiblockchain}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?required}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      # Optional AI
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Amazon Nova
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      NOVA_MODE: ${NOVA_MODE:-fallback}
      # ElevenLabs
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_ALERT_VOICE_ID: ${ELEVENLABS_ALERT_VOICE_ID:-VR6AewLTigWG4xSOukaG}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_MONTHLY_CHAR_LIMIT: ${ELEVENLABS_MONTHLY_CHAR_LIMIT:-500000}
      # Blockchain
      WALLET_PRIVATE_KEY: ${WALLET_PRIVATE_KEY:-}
      DEFAULT_CHAIN_ID: ${DEFAULT_CHAIN_ID:-1}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://eth.llamarpc.com}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      ARB_RPC_URL: ${ARB_RPC_URL:-https://arb1.arbitrum.io/rpc}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://rpc.sepolia.org}
      GAS_SPIKE_MAX_MULTIPLIER: ${GAS_SPIKE_MAX_MULTIPLIER:-3.0}
      # Stellar
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY:-}
      STELLAR_SECRET_KEY_TESTNET: ${STELLAR_SECRET_KEY_TESTNET:-}
      STELLAR_SECRET_KEY_FUTURENET: ${STELLAR_SECRET_KEY_FUTURENET:-}
      STELLAR_MAINNET_HORIZON_URL: ${STELLAR_MAINNET_HORIZON_URL:-https://horizon.stellar.org}
      STELLAR_TESTNET_HORIZON_URL: ${STELLAR_TESTNET_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_MAINNET_SOROBAN_RPC: ${STELLAR_MAINNET_SOROBAN_RPC:-https://soroban-mainnet.stellar.org:443}
      STELLAR_TESTNET_SOROBAN_RPC: ${STELLAR_TESTNET_SOROBAN_RPC:-https://soroban-testnet.stellar.org:443}
      # Auth
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_DURATION_MS: ${AUTH_LOCKOUT_DURATION_MS:-900000}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-127.0.0.1,::1}
      # Security
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      RATE_LIMIT_GATEWAY: ${RATE_LIMIT_GATEWAY:-60}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3001:3001"   # Gate        — internal only
      - "127.0.0.1:3002:3002"   # Auditor     — internal only
      - "127.0.0.1:3003:3003"   # Orchestrator— internal only
      - "127.0.0.1:3004:3004"   # Gateway     — proxied by nginx
      - "127.0.0.1:3005:3005"   # MCP         — internal only
      - "127.0.0.1:3006:3006"   # Database    — internal only
      - "127.0.0.1:3007:3007"   # Auth        — internal only
      - "127.0.0.1:3008:3008"   # Secrets     — internal only
      - "127.0.0.1:3009:3009"   # Events      — internal only
      - "127.0.0.1:3010:3010"   # Admin       — proxied by nginx (IP restricted)
      - "127.0.0.1:3011:3011"   # Blockchain  — internal only
      - "127.0.0.1:3012:3012"   # Frontend    — proxied by nginx
      - "127.0.0.1:3013:3013"   # Nova        — internal only
      - "127.0.0.1:3014:3014"   # Voice       — internal only
      - "127.0.0.1:3015:3015"   # Stellar     — internal only
    volumes:
      - logs:/app/logs
      - blockchain_workspace:/app/.blockchain-workspace
      - stellar_workspace:/app/.stellar-workspace
    networks:
      - aiops-internal
      - aiops-public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=256m

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aiops-nginx
    restart: unless-stopped
    depends_on:
      aiops:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro       # Mount SSL certs here
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - aiops-public
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Anvil local blockchain (optional, for dev/test) ──────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: aiops-anvil
    restart: unless-stopped
    profiles:
      - dev   # Only starts with: docker compose --profile dev up
    command: >
      anvil
      --host 0.0.0.0
      --port 8545
      --accounts 10
      --balance 10000
      --block-time 2
      --chain-id 31337
    ports:
      - "127.0.0.1:8545:8545"
    networks:
      - aiops-internal

volumes:
  postgres_data:
    name: aiops-postgres-data
  logs:
    name: aiops-logs
  blockchain_workspace:
    name: aiops-blockchain-workspace
  stellar_workspace:
    name: aiops-stellar-workspace
  nginx_cache:
    name: aiops-nginx-cache

networks:
  aiops-internal:
    name: aiops-internal
    driver: bridge
    internal: true   # No external internet access — internal services only
  aiops-public:
    name: aiops-public
    driver: bridge
