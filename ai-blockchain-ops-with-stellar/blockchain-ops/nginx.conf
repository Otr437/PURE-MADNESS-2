# ============================================================
# NGINX — AI Blockchain Ops Reverse Proxy
# Full production security:
# - TLS 1.2/1.3 only
# - HSTS with preload
# - Security headers on every response
# - Rate limiting per IP
# - Admin routes IP-restricted at nginx level (defense in depth)
# - SSE proxy with correct buffering disabled
# - Audio streaming for voice module
# - Gzip compression
# - Request size limits
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;   # Hide nginx version

    # ── Request size limits ──────────────────────────────────────
    client_max_body_size 2m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Rate limiting zones ───────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=static:10m rate=200r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── SSL settings ──────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Upstream: API Gateway (module4) ──────────────────────────
    upstream gateway {
        server aiops:3004;
        keepalive 32;
    }

    # ── Upstream: Frontend (module12) ────────────────────────────
    upstream frontend {
        server aiops:3012;
        keepalive 16;
    }

    # ── Upstream: Admin (module10) ────────────────────────────────
    upstream admin {
        server aiops:3010;
        keepalive 8;
    }

    # ── Upstream: Events SSE (module9) ───────────────────────────
    upstream events {
        server aiops:3009;
        keepalive 16;
    }

    # ── Security headers snippet ─────────────────────────────────
    map $sent_http_content_type $security_policy {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:";
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ── Security headers ───────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $security_policy always;

        limit_conn conn_limit 20;

        # ── Frontend (/) ─────────────────────────────────────────────
        location / {
            limit_req zone=static burst=50 nodelay;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── API (/api/*) ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;   # AI tasks can take time
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
        }

        # ── Auth routes (stricter rate limit) ─────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # ── SSE Events stream ─────────────────────────────────────────
        location /api/events/stream {
            limit_req zone=api burst=5 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE requires buffering disabled
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;  # SSE connections stay open
            chunked_transfer_encoding on;
            add_header Cache-Control "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # ── Voice audio streaming ──────────────────────────────────────
        location /api/voice/ {
            limit_req zone=api burst=10 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;   # Audio must stream without buffering
            proxy_read_timeout 60s;
        }

        # ── Admin API (IP-restricted at nginx level) ───────────────────
        location /admin/ {
            # Defense in depth: block non-admin IPs before hitting app
            # Add your server/VPN IPs here:
            allow 127.0.0.1;
            allow ::1;
            # allow YOUR.VPN.IP.ADDRESS;
            deny all;

            limit_req zone=admin burst=10 nodelay;
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Block hidden files and sensitive paths ─────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }
        location ~ \.(env|example|sh|ts|json|lock)$ {
            deny all;
            return 404;
        }
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /api/\n"; }
    }
}
