[package]
name = "rag-ai-rust"
version = "1.0.0"
edition = "2021"

[lib]
name = "rag_ai_rust"
path = "src/lib.rs"

# Binaries are auto-discovered from src/bin/*.rs by Cargo — no explicit [[bin]]
# entries needed. Available binaries:
#   rag_engine_demo, agent_loop_demo, react_loop_cli, harness_react_cli,
#   eval_harness_cli, rag_agent_cli, run_agent, rag_api_server, trading_agent_cli

[dependencies]
qdrant-client   = "1.13"
reqwest         = { version = "0.12", features = ["json", "blocking"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
sha2            = "0.10"
tokio           = { version = "1", features = ["full"] }
anyhow          = "1"
hex             = "0.4"
axum            = "0.8"
jsonwebtoken    = "9.3"
zip             = "2.2"
clap            = { version = "4.5", features = ["derive"] }
ctrlc           = "3.4"
chrono          = { version = "0.4", features = ["serde"] }
once_cell       = "1.20"
regex           = "1.11"
uuid            = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"
serial_test = "3.2"
