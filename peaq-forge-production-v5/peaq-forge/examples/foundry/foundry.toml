[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"
optimizer        = true
optimizer_runs   = 200
solc_version     = "0.8.28"
evm_version      = "paris"

[rpc_endpoints]
peaq   = "${PEAQ_MAINNET_RPC}"
agung  = "${PEAQ_AGUNG_RPC}"
krest  = "${PEAQ_KREST_RPC}"
local  = "http://127.0.0.1:8545"

[etherscan]
peaq  = { key = "no-key-needed", url = "https://peaq.subscan.io/api" }
agung = { key = "no-key-needed", url = "https://agung.subscan.io/api" }
